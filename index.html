
<!DOCTYPE html>

<head>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #071019;
  color: white;
  touch-action: none;
}
canvas { display: block; }
[hidden] { display: none !important; }

.screen {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: linear-gradient(
    130deg,
    #07111be9,
    #20394a99
  );
}
.panel {
  width: min(400px, 100%);
  text-align: center;
}
.logo {
  font-size: clamp(40px, 10vw, 72px);
  font-weight: 900;
  letter-spacing: -3px;
  animation: aparecer 1.4s ease both;
}
.logo span { color: #f2b744; }

@keyframes aparecer {
  from {
    opacity: 0;
    transform: translateY(35px) scale(.85);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
@keyframes pulsar {
  50% { opacity: .45; }
}
.sub {
  color: #b3c3cb;
  letter-spacing: 3px;
  font-size: 11px;
  margin: 15px 0 28px;
}
button {
  border: 0;
  border-radius: 12px;
  background: #f2b744;
  color: #15202a;
  font-weight: 900;
  padding: 14px 22px;
  cursor: pointer;
  touch-action: none;
}
button:disabled { opacity: .45; }

#lobby {
  background: linear-gradient(
    90deg, #07111be8, #07111b22
  );
  justify-content: flex-start;
}
.lobbyPanel {
  width: min(330px, 75vw);
}
.tag {
  color: #e6b04e;
  font-size: 12px;
  letter-spacing: 2px;
}
h1 { font-size: 34px; margin: 10px 0; }
#operatorName { color: #f2b744; }

#hud {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}
.top {
  display: flex;
  justify-content: space-between;
  padding: 14px;
  gap: 8px;
}
.box {
  padding: 10px 13px;
  border-radius: 10px;
  background: #07151ccc;
  font-weight: 800;
  font-size: 13px;
}
.bottom {
  position: absolute;
  bottom: 15px;
  left: 15px;
  right: 15px;
  display: flex;
  justify-content: space-between;
}
#crosshair {
  position: fixed;
  left: 50%;
  top: 47%;
  transform: translate(-50%, -50%);
  font-size: 27px;
  color: white;
  text-shadow: 0 0 5px black;
}
#touch {
  position: fixed;
  inset: 0;
  z-index: 4;
  pointer-events: none;
}
#joystick {
  pointer-events: auto;
  position: absolute;
  bottom: 80px;
  left: 25px;
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: #ffffff22;
  border: 2px solid #ffffff66;
}
#knob {
  position: absolute;
  left: 29px;
  top: 29px;
  width: 48px;
  height: 48px;
  background: #ffffff99;
  border-radius: 50%;
}
#fire, #reload {
  pointer-events: auto;
  position: absolute;
  right: 25px;
  bottom: 88px;
  width: 82px;
  height: 82px;
  border-radius: 50%;
  background: #e97645;
  color: white;
}
#reload {
  right: 118px;
  bottom: 100px;
  width: 60px;
  height: 60px;
  font-size: 10px;
  background: #354d5c;
}
#result {
  background: #071019e8;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

<body>

<!-- TELA DE ABERTURA -->
<div id="intro" class="screen">
  <div class="panel">
    <div class="tag">TACTICAL 3D EXPERIENCE</div>
    <div class="logo">ARENA <span>ZERO</span></div>
    <p class="sub">PREPARE-SE PARA A ARENA</p>

  </div>
</div>

<!-- LOBBY -->
<div id="lobby" class="screen" hidden>
  <div class="lobbyPanel">
    <div class="tag">ARENA ZERO · TEMPORADA 01</div>
    <h1>LOBBY</h1>
    <p>OPERADOR SELECIONADO</p>
    <h2 id="operatorName">FALCÃO</h2>
    <button id="change">TROCAR OPERADOR</button>
    <p id="status">Carregando personagem 3D...</p>
    <button id="play" disabled>INICIAR PARTIDA</button>
    <p style="font-size:12px;color:#acc0cc">

    <button id="again">JOGAR NOVAMENTE</button>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from
  "three/addons/loaders/GLTFLoader.js";
import { clone } from
  "three/addons/utils/SkeletonUtils.js";

// CONFIGURAÇÕES
const MAX_KILLS = 7;
const MATCH_TIME = 120;
const MAX_AMMO = 24;

const $ = id => document.getElementById(id);

let state = "intro";
let yaw = 0;
let kills = 0;
let time = MATCH_TIME;
let hp = 100;
let ammo = MAX_AMMO;
let cooldown = 0;
let reloading = 0;
let firing = false;
let selected = 0;

const keys = {};
const joystick = { x: 0, y: 0 };
const clock = new THREE.Clock();
const raycaster = new THREE.Raycaster();

const operators = [
  { name: "FALCÃO", color: 0xc5d8d9 },
  { name: "ECO", color: 0xb2c9a5 },
  { name: "VIGIA", color: 0xc5bacb }
];

// CENA 3D
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91a9b6);
scene.fog = new THREE.Fog(0x91a9b6, 35, 90);

const camera = new THREE.PerspectiveCamera(
  65,
  innerWidth / innerHeight,
  .1,
  150
);

const renderer = new THREE.WebGLRenderer({
  antialias: false
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(
  Math.min(devicePixelRatio, 1.5)
);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const ambient = new THREE.HemisphereLight(
  0xcce6ff, 0x675a4c, 2.2
);
scene.add(ambient);

const sun = new THREE.DirectionalLight(
  0xffe1b5, 2.7
);
sun.position.set(-15, 27, 13);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -35;
sun.shadow.camera.right = 35;
sun.shadow.camera.top = 35;
sun.shadow.camera.bottom = -35;
scene.add(sun);

// MUNDO
const world = new THREE.Group();
scene.add(world);
world.visible = false;

const obstacles = [];
const collisions = [];

const mat = color => new THREE.MeshStandardMaterial({
  color,
  roughness: .85,
  metalness: .08
});

function box(x, z, w, d, h, color, solid = true) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    mat(color)
  );
  mesh.position.set(x, h / 2, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  world.add(mesh);

  if (solid) {
    obstacles.push(mesh);
    collisions.push({ x, z, w, d });
  }
  return mesh;
}

// CHÃO
box(0, 0, 48, 48, .3, 0xa99b83, false);

// MUROS
box(0, -24, 48, .7, 4, 0xaaa69b);
box(0, 24, 48, .7, 4, 0xaaa69b);
box(-24, 0, .7, 48, 4, 0xaaa69b);
box(24, 0, .7, 48, 4, 0xaaa69b);

// GALPÕES, PAREDES E CAIXAS
box(-12, -3, 1, 15, 3.5, 0x878b87);
box(12, 2, 1, 15, 3.5, 0x878b87);
box(-4, 7, 10, 1, 3, 0xc5af93);
box(5, 12, 9, 1, 3, 0xc5af93);

[
  [-6,-5,3,3,2],
  [5,-4,4,2,2.4],
  [-15,10,3,4,2],
  [15,8,4,3,2.5],
  [-5,16,3,3,1.8],
  [7,-15,3,3,2],
  [0,2,2,2,1.5]
].forEach((v,i) => {
  box(...v, i % 2 ? 0x648c91 : 0xc58c58);
});

// MODELOS E ANIMAÇÕES
let template;
let clips = [];
let lobbyActor;
let playerActor;
const bots = [];

const mixers = [];

function makeActor(tint) {
  const group = new THREE.Group();
  const model = clone(template);

  model.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
      o.material = o.material.clone();
      o.userData.baseColor =
        o.material.color.clone();
      o.material.color.multiply(
        new THREE.Color(tint)
      );
    }
  });

  group.add(model);
  scene.add(group);

  const mixer = new THREE.AnimationMixer(model);
  const actions = {};

  clips.forEach(clip => {
    actions[clip.name.toLowerCase()] =
      mixer.clipAction(clip);
  });

  mixers.push(mixer);

  const actor = {
    group, model, mixer, actions,
    current: "",
    alive: true,
    health: 100,
    respawn: 0,
    attack: 1
  };

  setAnimation(actor, "idle");
  return actor;
}

function setAnimation(actor, name) {
  if (actor.current === name) return;

  const next = actor.actions[name];
  if (!next) return;

  const old = actor.actions[actor.current];
  if (old) old.fadeOut(.2);

  next.reset().fadeIn(.2).play();
  actor.current = name;
}

function tintActor(actor, color) {
  actor.model.traverse(o => {
    if (!o.isMesh || !o.userData.baseColor)
      return;

    o.material.color.copy(
      o.userData.baseColor
    ).multiply(new THREE.Color(color));
  });
}

const spawnPoints = [
  [-16, 14], [16, 15],
  [0, 18], [-6, 3],
  [7, 6], [-14, -12],
  [14, -9]
];

function spawnBot(bot, index) {
  const pos = spawnPoints[
    (index + kills) % spawnPoints.length
  ];

  bot.group.position.set(pos[0], 0, pos[1]);
  bot.group.visible = true;
  bot.health = 100;
  bot.alive = true;
  bot.attack = 1.5;
  setAnimation(bot, "run");
}

async function loadCharacters() {
  try {
    const loader = new GLTFLoader();

    const data = await loader.loadAsync(
      "https://threejs.org/examples/models/gltf/Soldier.glb"
    );

    template = data.scene;
    clips = data.animations;

    lobbyActor = makeActor(
      operators[selected].color
    );

    playerActor = makeActor(
      operators[selected].color
    );
    playerActor.group.visible = false;

    for (let i = 0; i < 5; i++) {
      const bot = makeActor(0xd6a9a0);
      bot.group.visible = false;
      bots.push(bot);
    }

    $("status").textContent =
      "OPERADOR PRONTO";
    $("play").disabled = false;

  } catch (err) {
    console.error(err);
    $("status").textContent =
      "Erro ao carregar modelo 3D. Verifique a conexão.";
  }
}

loadCharacters();

// COLISÃO
function blocked(x, z, radius = .5) {
  for (const b of collisions) {
    const cx = THREE.MathUtils.clamp(
      x, b.x - b.w/2, b.x + b.w/2
    );
    const cz = THREE.MathUtils.clamp(
      z, b.z - b.d/2, b.z + b.d/2
    );

    if ((x-cx)**2 + (z-cz)**2 <
        radius**2) {
      return true;
    }
  }
  return false;
}

function move(group, dx, dz) {
  const p = group.position;
  if (!blocked(p.x + dx, p.z))
    p.x += dx;
  if (!blocked(p.x, p.z + dz))
    p.z += dz;
}

function visibleTarget(a, b) {
  const direction = b.clone().sub(a);
  const distance = direction.length();

  raycaster.set(a, direction.normalize());
  raycaster.far = distance;

  const hits = raycaster.intersectObjects(
    obstacles, false
  );

  return hits.length === 0 ||
    hits[0].distance >= distance - .3;
}

// LOBBY
function showLobby() {
  state = "lobby";
  world.visible = false;

  $("intro").hidden = true;
  $("result").hidden = true;
  $("hud").hidden = true;
  $("touch").hidden = true;
  $("lobby").hidden = false;

  if (playerActor)
    playerActor.group.visible = false;

  bots.forEach(b => b.group.visible = false);

  if (lobbyActor) {
    lobbyActor.group.visible = true;
    lobbyActor.group.position.set(0, 0, 0);
    setAnimation(lobbyActor, "idle");
  }
}

$("enter").onclick = showLobby;

$("change").onclick = () => {
  selected = (selected + 1) % operators.length;
  $("operatorName").textContent =
    operators[selected].name;

  if (lobbyActor) {
    tintActor(
      lobbyActor,
      operators[selected].color
    );
    tintActor(
      playerActor,
      operators[selected].color
    );
  }
};

// INÍCIO DA PARTIDA
function startMatch() {
  if (!playerActor) return;

  state = "match";
  kills = 0;
  time = MATCH_TIME;
  hp = 100;
  ammo = MAX_AMMO;
  yaw = 0;
  cooldown = 0;
  reloading = 0;

  $("lobby").hidden = true;
  $("result").hidden = true;
  $("hud").hidden = false;
  $("touch").hidden = false;

  world.visible = true;
  lobbyActor.group.visible = false;

  playerActor.group.visible = true;
  playerActor.group.position.set(0, 0, -17);

  bots.forEach((b,i) => spawnBot(b,i));
  updateHud();
}

$("play").onclick = startMatch;
$("again").onclick = startMatch;
$("back").onclick = showLobby;

// INTERFACE
function updateHud() {
  $("score").textContent =
    kills + " / " + MAX_KILLS;

  const t = Math.max(0, Math.ceil(time));

  $("timer").textContent =
    String(Math.floor(t / 60)).padStart(2,"0")
    + ":" +
    String(t % 60).padStart(2,"0");

  $("health").textContent =
    "VIDA " + Math.ceil(hp);

  $("ammo").textContent = reloading > 0
    ? "RECARREGANDO"
    : ammo + " / " + MAX_AMMO;
}

// SISTEMA DE DISPARO VIRTUAL
function fire() {
  if (state !== "match" ||
      cooldown > 0 ||
      reloading > 0) return;

  if (ammo <= 0) {
    reload();
    return;
  }

  ammo--;
  cooldown = .19;

  const start = playerActor.group.position
    .clone().add(new THREE.Vector3(0,1.4,0));

  const direction = new THREE.Vector3(
    Math.sin(yaw), 0, Math.cos(yaw)
  );

  let target = null;
  let bestDistance = Infinity;

  for (const bot of bots) {
    if (!bot.alive) continue;

    const center = bot.group.position
      .clone().add(new THREE.Vector3(0,1.2,0));

    const delta = center.clone().sub(start);
    const distance = delta.length();
    const alignment =
      delta.clone().normalize().dot(direction);

    if (distance < 22 &&
        alignment > .973 &&
        distance < bestDistance &&
        visibleTarget(start, center)) {
      target = bot;
      bestDistance = distance;
    }
  }

  if (target) {
    target.health -= 40;

    if (target.health <= 0) {
      target.alive = false;
      target.group.visible = false;
      target.respawn = 3;
      kills++;

      if (kills >= MAX_KILLS) {
        finish(true);
      }
    }
  }

  updateHud();
}

function reload() {
  if (state === "match" &&
      ammo < MAX_AMMO &&
      reloading <= 0) {
    reloading = 1.2;
  }
}

// BOTS
function updateBots(dt) {
  const playerPos = playerActor.group.position;

  for (let i = 0; i < bots.length; i++) {
    const bot = bots[i];

    if (!bot.alive) {
      bot.respawn -= dt;

      if (bot.respawn <= 0)
        spawnBot(bot, i);

      continue;
    }

    const p = bot.group.position;
    const dx = playerPos.x - p.x;
    const dz = playerPos.z - p.z;
    const distance = Math.hypot(dx,dz);

    bot.group.rotation.y = Math.atan2(dx,dz);

    if (distance > 3) {
      const speed = 1.6 * dt;
      move(
        bot.group,
        dx / distance * speed,
        dz / distance * speed
      );
      setAnimation(bot, "run");
    } else {
      setAnimation(bot, "idle");
    }

    bot.attack -= dt;

    if (bot.attack <= 0 && distance < 12) {
      bot.attack = 1.7 + Math.random();

      const from = p.clone()
        .add(new THREE.Vector3(0,1.4,0));

      const to = playerPos.clone()
        .add(new THREE.Vector3(0,1.4,0));

      if (visibleTarget(from,to)) {
        hp = Math.max(0, hp - 7);

        if (hp <= 0) {
          finish(false);
          return;
        }
      }
    }
  }
}

// FIM DA PARTIDA
function finish(victory) {
  state = "result";
  firing = false;

  $("hud").hidden = true;
  $("touch").hidden = true;
  $("result").hidden = false;

  $("resultTitle").textContent =
    victory ? "VITÓRIA!" : "FIM DE PARTIDA";

  $("stats").textContent =
    "Eliminações: " + kills +
    " | Vida restante: " + Math.ceil(hp);
}

// MOVIMENTAÇÃO
function updatePlayer(dt) {
  const forward =
    (keys["w"] ? 1 : 0) -
    (keys["s"] ? 1 : 0) -
    joystick.y;

  const side =
    (keys["d"] ? 1 : 0) -
    (keys["a"] ? 1 : 0) +
    joystick.x;

  const length = Math.hypot(forward,side);

  if (length > .05) {
    const f = forward / Math.max(1,length);
    const r = side / Math.max(1,length);

    const speed = 5 * dt;

    move(
      playerActor.group,
      (Math.sin(yaw)*f + Math.cos(yaw)*r)*speed,
      (Math.cos(yaw)*f - Math.sin(yaw)*r)*speed
    );

    setAnimation(playerActor, "run");
  } else {
    setAnimation(playerActor, "idle");
  }

  playerActor.group.rotation.y = yaw;

  const p = playerActor.group.position;
  const direction = new THREE.Vector3(
    Math.sin(yaw), 0, Math.cos(yaw)
  );

  const destination = p.clone()
    .add(new THREE.Vector3(0,3.3,0))
    .addScaledVector(direction,-5.6);

  camera.position.lerp(destination,.12);

  const lookAt = p.clone()
    .add(new THREE.Vector3(0,1.5,0))
    .addScaledVector(direction,6);

  camera.lookAt(lookAt);
}

// CONTROLES DO IPHONE
const joy = $("joystick");
const knob = $("knob");
let joyPointer = null;
let aimPointer = null;
let lastX = 0;

function setJoystick(e) {
  const r = joy.getBoundingClientRect();

  let x = (e.clientX-r.left-r.width/2)/35;
  let y = (e.clientY-r.top-r.height/2)/35;

  const n = Math.max(1,Math.hypot(x,y));
  joystick.x = x/n;
  joystick.y = y/n;

  knob.style.transform =
    `translate(${joystick.x*30}px,${joystick.y*30}px)`;
}

joy.onpointerdown = e => {
  joyPointer = e.pointerId;
  joy.setPointerCapture(e.pointerId);
  setJoystick(e);
};

joy.onpointermove = e => {
  if (joyPointer === e.pointerId)
    setJoystick(e);
};

function releaseJoy(e) {
  if (joyPointer !== e.pointerId) return;
  joyPointer = null;
  joystick.x = joystick.y = 0;
  knob.style.transform = "";
}

joy.onpointerup = releaseJoy;
joy.onpointercancel = releaseJoy;

renderer.domElement.onpointerdown = e => {
  if (state !== "match") return;

  aimPointer = e.pointerId;
  lastX = e.clientX;
  renderer.domElement.setPointerCapture(e.pointerId);

  if (e.pointerType === "mouse") {
    firing = true;
    fire();
  }
};

renderer.domElement.onpointermove = e => {
  if (aimPointer === e.pointerId &&
      state === "match") {
    yaw += (e.clientX-lastX)*.006;
    lastX = e.clientX;
  }
};

renderer.domElement.onpointerup = e => {
  if (e.pointerId === aimPointer)
    aimPointer = null;
  firing = false;
};

$("fire").onpointerdown = e => {
  e.stopPropagation();
  firing = true;
  fire();
  $("fire").setPointerCapture(e.pointerId);
};
$("fire").onpointerup = () => firing = false;
$("fire").onpointercancel = () => firing = false;

$("reload").onclick = reload;

// CONTROLES DE COMPUTADOR
window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === "r")
    reload();
});
window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

// LOOP PRINCIPAL
function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(),.05);

  mixers.forEach(m => m.update(dt));

  if (state === "lobby") {
    camera.position.set(3,2.5,6);
    camera.lookAt(0,1,0);

    if (lobbyActor) {
      lobbyActor.group.rotation.y += dt*.25;
    }
  }

  if (state === "match") {
    time -= dt;
    cooldown = Math.max(0,cooldown-dt);

    if (reloading > 0) {
      reloading -= dt;
      if (reloading <= 0) {
        ammo = MAX_AMMO;
        reloading = 0;
      }
    }

    if (keys["arrowleft"]) yaw -= dt*2;
    if (keys["arrowright"]) yaw += dt*2;

    updatePlayer(dt);
    updateBots(dt);

    if (firing) fire();

    updateHud();

    if (time <= 0) finish(false);
  }

  if (state === "intro") {
    camera.position.set(3,2.5,6);
    camera.lookAt(0,1,0);
  }

  renderer.render(scene,camera);
}

animate();

window.addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
